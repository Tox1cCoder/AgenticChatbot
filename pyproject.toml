[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-chatbot"
version = "0.1.0"
description = "A sample chatbot application with FastAPI and PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.12.1",
    "bcrypt",
    "dependency-injector",
    "email-validator>=2.1.0",
    "fastapi>=0.104.1",
    "google-generativeai",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "PyJWT",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "uvicorn[standard]>=0.24.0",
    "langchain",
    "langgraph",
    "langsmith",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true