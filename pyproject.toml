[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-chatbot"
version = "1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "websockets>=12.0",
    
    # Database & ORM
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    
    # Authentication & Security
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.1.0",
    
    # Dependency Injection
    "dependency-injector>=4.41.0",
    
    # Task Queue & Background Processing
    "celery[redis]>=5.3.4",
    "redis>=5.0.1",
    "prometheus-client>=0.21.0",
    
    # AI & LangChain Ecosystem
    "langchain>=1.3.4,<2.0.0",
    "langchain-community>=0.4.2,<1.0.0",
    "langchain-core>=1.4.2,<2.0.0",
    "langgraph>=1.2.4,<2.0.0",
    "langgraph-checkpoint>=4.1.1,<5.0.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "langsmith>=0.8.11,<1.0.0",
    "langchain-google-genai>=4.2.4,<5.0.0",
    "langchain-openai>=1.2.2,<2.0.0",
    "langchain-mcp-adapters>=0.2.2,<1.0.0",
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "langchain-tavily>=0.2.0",
    
    # Vector Database & Embeddings
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.2",
    "transformers>=4.30.0",
    "huggingface-hub>=0.34.0,<1.0",
    "torch>=2.1.0",
    
    # Token Counting & NLP
    "tiktoken>=0.5.0",
    "nltk>=3.8.0",
    
    # Document Processing
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
    "openpyxl>=3.1.2",
    "Pillow>=10.0.0",
    "pdfplumber>=0.11.0",
    "tabulate>=0.9.0",
    
    # Utilities
    "fastapi-radar>=0.0.2",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
codex-client-backend = "client_backend.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "client_backend"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Third-party packages currently emit Python 3.14+ compatibility warnings
    # during import/callback handling. Keep the filters scoped so application
    # deprecations still surface in test output.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:pydantic\\.v1",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:langchain_core\\._api\\.deprecation",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16; use inspect\\.iscoroutinefunction\\(\\) instead:DeprecationWarning:langchain_core\\.callbacks\\.manager",
]

[tool.ruff]
# Thư mục/file muốn bỏ qua
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "venv",
]

# Độ dài tối đa của một dòng (Black mặc định là 88, nhiều dự án dùng 100-120)
line-length = 100

# Phiên bản Python tối thiểu dự án hỗ trợ
target-version = "py310"

[tool.ruff.lint]
# Bật các rule kiểm tra (Mặc định Ruff chỉ bật E và F)
# Tham khảo: https://docs.astral.sh/ruff/rules/
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (Sắp xếp import)
    "UP", # pyupgrade (Gợi ý cú pháp Python mới)
    "B",  # flake8-bugbear (Phát hiện các lỗi tiềm ẩn)
    "SIM",# flake8-simplify (Gợi ý viết code đơn giản hơn)
]

# Bỏ qua một số rule cụ thể nếu thấy phiền
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the idiomatic way to declare route
# parameters and are safe as argument defaults; exempt them from B008 ("Do not
# perform function call in argument defaults"), which would otherwise flag
# every FastAPI route across the codebase.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.format]
# Cấu hình formatter (giống Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
