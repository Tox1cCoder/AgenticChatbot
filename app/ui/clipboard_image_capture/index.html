<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family:
          "Source Sans Pro",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body[data-visible="false"] .capture-shell {
        display: none;
      }

      .capture-shell {
        box-sizing: border-box;
        width: 100%;
        padding: 4px 0 8px;
      }

      .drop-target {
        box-sizing: border-box;
        width: 100%;
        min-height: 64px;
        border: 1px dashed rgba(49, 51, 63, 0.35);
        border-radius: 8px;
        background: rgba(250, 250, 251, 0.96);
        color: rgb(49, 51, 63);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        padding: 12px 14px;
        outline: none;
      }

      .drop-target:hover,
      .drop-target:focus,
      .drop-target.dragging {
        border-color: rgb(255, 75, 75);
        background: rgba(255, 246, 246, 0.96);
      }

      .drop-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.25;
      }

      .drop-help {
        color: rgba(49, 51, 63, 0.72);
        font-size: 12px;
        line-height: 1.25;
      }

      .file-input {
        display: none;
      }
    </style>
    <script>
      const MOUNT_ID = `mount-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const VISIBLE_FRAME_HEIGHT = 84;
      let componentArgs = { visible: false };
      let topDoc = null;

      function sendStreamlitMessage(type, data) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: type,
            ...data,
          },
          "*"
        );
      }

      function setComponentValue(value) {
        sendStreamlitMessage("streamlit:setComponentValue", { value: value });
      }

      function setFrameHeight(height) {
        sendStreamlitMessage("streamlit:setFrameHeight", { height: height });
      }

      function componentReady() {
        sendStreamlitMessage("streamlit:componentReady", { apiVersion: 1 });
        setFrameHeight(0);
      }

      function componentVisible() {
        return Boolean(componentArgs && componentArgs.visible);
      }

      function resolveTopDocument() {
        try {
          topDoc = window.parent.document;
        } catch (_) {
          topDoc = null;
        }
        return topDoc;
      }

      function registerActiveReceiver() {
        const doc = resolveTopDocument();
        if (!doc) return;
        doc.__chatImagePasteActiveReceiver = setComponentValue;
        doc.__chatImagePasteActiveMountId = MOUNT_ID;
      }

      function activeChatTextarea(doc) {
        const active = doc.activeElement;
        if (!active || active.tagName !== "TEXTAREA") return null;
        const placeholder = active.getAttribute("placeholder") || "";
        const label = active.getAttribute("aria-label") || "";
        if (placeholder === "Type your message..." || label === "Message") {
          return active;
        }
        return null;
      }

      function filesFromClipboard(clipboard) {
        const files = [];
        if (!clipboard || !clipboard.items) return files;

        for (const item of clipboard.items) {
          if (item.kind === "file" && item.type && item.type.startsWith("image/")) {
            const file = item.getAsFile();
            if (file) files.push(file);
          }
        }
        return files;
      }

      function imageFilesFromList(fileList) {
        return Array.from(fileList || []).filter(
          (file) => file && file.type && file.type.startsWith("image/")
        );
      }

      async function fileToPayload(file, index) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            resolve({
              name: file.name || `clipboard-image-${Date.now()}-${index}.png`,
              mime: file.type || "image/png",
              data: String(reader.result || ""),
            });
          };
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      async function filesToPayload(files) {
        const payload = [];
        for (let index = 0; index < files.length; index += 1) {
          try {
            payload.push(await fileToPayload(files[index], index + 1));
          } catch (_) {
            // Skip unreadable clipboard/drop entries.
          }
        }
        return payload;
      }

      async function emitImageFiles(files, receiver) {
        const imageFiles = imageFilesFromList(files);
        if (!imageFiles.length) return false;

        const payload = await filesToPayload(imageFiles);
        if (!payload.length) return false;

        const eventId = `attach-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        receiver({
          eventId: eventId,
          images: payload,
        });
        return true;
      }

      async function sendImages(files) {
        return emitImageFiles(files, setComponentValue);
      }

      function selectImageFiles() {
        const input = document.getElementById("fileInput");
        if (input) input.click();
      }

      function installParentPasteListener() {
        const doc = resolveTopDocument();
        if (!doc) return;
        registerActiveReceiver();
        if (doc.__chatImagePasteInstalled) return;
        doc.__chatImagePasteInstalled = true;

        doc.addEventListener(
          "paste",
          async function (event) {
            if (!activeChatTextarea(doc)) return;

            const files = filesFromClipboard(event.clipboardData);
            if (!files.length) return;
            event.preventDefault();

            const receiver =
              typeof doc.__chatImagePasteActiveReceiver === "function"
                ? doc.__chatImagePasteActiveReceiver
                : setComponentValue;
            await emitImageFiles(files, receiver);
          },
          true
        );
      }

      function render(args) {
        componentArgs = args || {};
        document.body.dataset.visible = componentVisible() ? "true" : "false";
        setFrameHeight(componentVisible() ? VISIBLE_FRAME_HEIGHT : 0);
        registerActiveReceiver();
      }

      function installVisibleAttachmentTarget() {
        const target = document.getElementById("dropTarget");
        const input = document.getElementById("fileInput");
        if (!target || !input) return;

        input.addEventListener("change", async function (event) {
          if (await sendImages(event.target.files)) {
            input.value = "";
          }
        });

        target.addEventListener("click", function () {
          selectImageFiles();
        });

        target.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectImageFiles();
          }
        });

        target.addEventListener("dragover", function (event) {
          event.preventDefault();
          target.classList.add("dragging");
        });

        target.addEventListener("dragleave", function () {
          target.classList.remove("dragging");
        });

        target.addEventListener("drop", async function (event) {
          event.preventDefault();
          target.classList.remove("dragging");
          await sendImages(event.dataTransfer ? event.dataTransfer.files : []);
        });

        target.addEventListener("paste", async function (event) {
          const files = filesFromClipboard(event.clipboardData);
          if (!files.length) return;
          event.preventDefault();
          await sendImages(files);
        });
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        render(event.data.args || {});
      });

      componentReady();
      installVisibleAttachmentTarget();
      installParentPasteListener();
      render({});
    </script>
  </head>
  <body data-visible="false">
    <div class="capture-shell">
      <div
        id="dropTarget"
        class="drop-target"
        role="button"
        tabindex="0"
        aria-label="Attach images"
      >
        <div class="drop-title">Paste, drop, or choose images</div>
        <div class="drop-help">PNG, JPG, GIF, or WebP. Multiple images are supported.</div>
      </div>
      <input id="fileInput" class="file-input" type="file" accept="image/*" multiple />
    </div>
  </body>
</html>
