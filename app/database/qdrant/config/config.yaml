yaml
storage:
  storage_path: "./storage"

service:
  host: "0.0.0.0"
  http_port: 6333
  grpc_port: 6334

log_level: INFO

cors:
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
  allow_headers:
    - "*"

cluster:
  enabled: false

telemetry:
  disabled: true